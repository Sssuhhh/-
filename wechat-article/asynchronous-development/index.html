<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公众号排版｜最容易被当成“毛病”纠正的4种行为</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FBF3F8;
    color: #4B4453;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 20px;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid #F6D3E2;
  }
  .bar h1 { margin: 0; font-size: 16px; font-weight: 800; }
  .bar .actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .seg { display: flex; border: 2px solid #E8558A; border-radius: 999px; overflow: hidden; background: #fff; }
  .seg button {
    border: 0; background: transparent; color: #E8558A; cursor: pointer;
    padding: 7px 14px; font-size: 13px; font-weight: 700; font-family: inherit;
  }
  .seg button[aria-pressed="true"] { background: #E8558A; color: #fff; }
  #copy {
    border: 0; border-radius: 999px; cursor: pointer;
    background: #FF8FB1; color: #fff; box-shadow: 0 4px 0 #E8558A;
    padding: 10px 22px; font-size: 15px; font-weight: 800; font-family: inherit;
    transition: transform .08s, box-shadow .08s;
  }
  #copy:active { transform: translateY(4px); box-shadow: 0 0 0 #E8558A; }
  .steps {
    max-width: 720px; margin: 20px auto 0; padding: 0 16px;
    font-size: 13px; line-height: 1.7; color: #8C8198; text-align: center;
  }
  .steps b { color: #4B4453; }
  .steps a { color: #E8558A; font-weight: 700; }
  .stage { padding: 20px 16px 60px; }
  #preview {
    width: 100%; max-width: 420px; margin: 0 auto; background: #fff;
    padding: 22px 16px 30px; border-radius: 26px;
    box-shadow: 0 10px 40px rgba(232, 85, 138, .12);
  }
  #preview.wide { max-width: 709px; }
  #toast {
    position: fixed; left: 50%; bottom: 36px; transform: translate(-50%, 20px);
    background: #4B4453; color: #fff; padding: 11px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 560px) {
    .bar h1 { display: none; }
    .bar { justify-content: center; }
  }
</style>
</head>
<body>

<header class="bar">
  <h1>公众号排版｜最容易被当成“毛病”纠正的4种行为</h1>
  <div class="actions">
    <div class="seg" role="group" aria-label="预览宽度">
      <button type="button" data-width="phone" aria-pressed="true">手机</button>
      <button type="button" data-width="wide" aria-pressed="false">电脑</button>
    </div>
    <button type="button" id="copy">一键复制到公众号</button>
  </div>
</header>

<p class="steps">
  <b>① 点「一键复制到公众号」</b> → <b>② 打开公众号后台的图文编辑器，点一下正文区域</b> → <b>③ Ctrl / ⌘ + V 粘贴</b><br>
  建议用电脑上的 Chrome 或 Edge 操作；文章标题请在后台单独填写。<br>
  封面图下载：<a href="cover-900x383.png" download>横版 2.35:1</a> ｜ <a href="cover-1x1.png" download>方形 1:1</a>
</p>

<main class="stage">
  <div id="preview"></div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- 插画（纯内联 SVG：不含 id / class / style 标签 / 外链，公众号可直接粘贴） ---------- */

const INK = '#5A4868';
const TEXT = '#4B4453';
const SKIN = '#FFE1CC';
const HAIR = '#6B4E3D';
const C = {
  pink: { c: '#FF8FB1', l: '#FFE4EE', d: '#E8558A' },
  lemon: { c: '#FFD95A', l: '#FFF6D2', d: '#B97F00' },
  mint: { c: '#6FD6B5', l: '#DDF7EE', d: '#1F9E7A' },
  blue: { c: '#7DBDFF', l: '#E0F0FF', d: '#3A86D9' },
  lav: { c: '#B49CFF', l: '#EEE8FF', d: '#7A5BE0' },
  peach: { c: '#FFAE8A', l: '#FFEADF', d: '#E26A3B' },
};

const n = (v) => Math.round(v * 10) / 10;
const st = (w = 2.8) => `stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
const svg = (h, inner, w = 640) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" style="display:block;width:100%;height:auto;">${inner}</svg>`;

const twinkle = (begin = 0, dur = 1.8) =>
  `<animate attributeName="opacity" values="1;0.2;1" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>`;
const bob = (inner, dy = 6, dur = 3, begin = 0) =>
  `<g>${inner}<animateTransform attributeName="transform" type="translate" values="0 0;0 ${-dy};0 0" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></g>`;
const slide = (inner, dx = 6, dur = 1.2, begin = 0) =>
  `<g>${inner}<animateTransform attributeName="transform" type="translate" values="0 0;${dx} 0;0 0" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></g>`;
const sway = (inner, cx, cy, deg = 8, dur = 2.4) =>
  `<g>${inner}<animateTransform attributeName="transform" type="rotate" values="${-deg} ${cx} ${cy};${deg} ${cx} ${cy};${-deg} ${cx} ${cy}" dur="${dur}s" repeatCount="indefinite"/></g>`;

const sparkle = (x, y, r, fill = '#fff', begin = 0) => {
  const k = r * 0.24;
  const d = `M${x},${y - r} Q${x + k},${y - k} ${x + r},${y} Q${x + k},${y + k} ${x},${y + r} Q${x - k},${y + k} ${x - r},${y} Q${x - k},${y - k} ${x},${y - r}Z`;
  return `<path d="${d}" fill="${fill}">${twinkle(begin)}</path>`;
};

const star5 = (x, y, R, fill, w = 2.8) => {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = ((-90 + i * 36) * Math.PI) / 180;
    const r = i % 2 ? R * 0.52 : R;
    pts.push(`${n(x + r * Math.cos(a))},${n(y + r * Math.sin(a))}`);
  }
  return `<polygon points="${pts.join(' ')}" fill="${fill}" ${st(w)}/>`;
};

const limb = (d, color, w = 14) =>
  `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 5.6}" stroke-linecap="round" stroke-linejoin="round"/>` +
  `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

const hand = (x, y, r = 9) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${SKIN}" ${st()}/>`;

const blob = (circles, fill, w = 5.6) =>
  circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${st(w)}/>`).join('') +
  circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join('');

const puff = (circles, opacity = 0.7) =>
  `<g fill="#fff" opacity="${opacity}">${circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>`;

const label = (x, y, size, text, fill = INK, extra = '') =>
  `<text x="${x}" y="${y}" font-size="${size}" font-weight="900" fill="${fill}" text-anchor="middle" ${extra}>${text}</text>`;

const pill = (cx, cy, w, h, fill, text, color, size = 19) =>
  `<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}"/>` + label(cx, n(cy + size * 0.36), size, text, color);

const miniFace = (x, y, s = 1, mood = 'smile') =>
  `<g transform="translate(${x} ${y}) scale(${s})">` +
  `<circle cx="-9" cy="0" r="3.4" fill="${INK}"/><circle cx="9" cy="0" r="3.4" fill="${INK}"/>` +
  (mood === 'smile' ? `<path d="M-5,7 Q0,12 5,7" fill="none" ${st(2.6)}/>` : `<path d="M-5,11 Q0,6 5,11" fill="none" ${st(2.6)}/>`) +
  `<ellipse cx="-17" cy="7" rx="5" ry="3.2" fill="#FF7FA6" opacity="0.5"/><ellipse cx="17" cy="7" rx="5" ry="3.2" fill="#FF7FA6" opacity="0.5"/></g>`;

const drop = (x, y, s = 1, fill = '#7DBDFF') =>
  `<path d="M${x},${y - 8 * s} Q${x - 6 * s},${y + 2 * s} ${x},${y + 6 * s} Q${x + 6 * s},${y + 2 * s} ${x},${y - 8 * s}Z" fill="${fill}" ${st(2)}/>`;

function head(cx, cy, o = {}) {
  const { k = 1, rot = 0, hair = HAIR, style = 'bowl', eyes = 'dot', mouth = 'smile', look = [0, 0] } = o;
  const [lx, ly] = look;
  let s = `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${k})">`;

  if (style === 'mom') {
    s += `<path d="M-37,-6 Q-40,-40 0,-40 Q40,-40 37,-6 L40,26 Q31,35 22,27 L22,6 L-22,6 L-22,27 Q-31,35 -40,26Z" fill="${hair}" ${st()}/>`;
  }
  s += `<circle cx="-33" cy="5" r="6" fill="${SKIN}" ${st()}/><circle cx="33" cy="5" r="6" fill="${SKIN}" ${st()}/>`;
  s += `<circle cx="0" cy="0" r="34" fill="${SKIN}" ${st()}/>`;

  const hairPath = {
    bowl: 'M-36,-2 A36,36 0 0 1 36,-2 Q31,-17 16,-18 Q4,-9 -8,-18 Q-24,-17 -36,-2Z',
    mom: 'M-36,-2 A36,36 0 0 1 36,-2 Q30,-17 14,-23 Q-6,-7 -36,-2Z',
  }[style];
  s += `<path d="${hairPath}" fill="${hair}" ${st()}/>`;

  const ex = 13, ey = 5;
  const dotEye = (x, r) =>
    `<circle cx="${x + lx}" cy="${ey + ly}" r="${r}" fill="${INK}"/><circle cx="${n(x + lx - r * 0.32)}" cy="${n(ey + ly - r * 0.36)}" r="${n(r * 0.36)}" fill="#fff"/>`;
  const arcEye = (x, up) => `<path d="M${x - 6},${ey + (up ? 2 : -1)} Q${x},${ey + (up ? -6 : 7)} ${x + 6},${ey + (up ? 2 : -1)}" fill="none" ${st(3)}/>`;
  if (eyes === 'dot') s += dotEye(-ex, 4.8) + dotEye(ex, 4.8);
  if (eyes === 'big') s += dotEye(-ex, 6.4) + dotEye(ex, 6.4);
  if (eyes === 'happy') s += arcEye(-ex, true) + arcEye(ex, true);
  if (eyes === 'cry') {
    s += arcEye(-ex, false) + arcEye(ex, false);
    s += `<path d="M-23,-6 L-11,-10" fill="none" ${st(2.4)}/><path d="M23,-6 L11,-10" fill="none" ${st(2.4)}/>`;
  }
  if (eyes === 'frown') {
    s += dotEye(-ex, 4.8) + dotEye(ex, 4.8);
    s += `<path d="M-21,-9 L-9,-5" fill="none" ${st(2.4)}/><path d="M21,-9 L9,-5" fill="none" ${st(2.4)}/>`;
  }

  s += `<ellipse cx="-22" cy="15" rx="6.5" ry="4.2" fill="#FF7FA6" opacity="0.55"/><ellipse cx="22" cy="15" rx="6.5" ry="4.2" fill="#FF7FA6" opacity="0.55"/>`;

  if (mouth === 'smile') s += `<path d="M-6,15 Q0,21 6,15" fill="none" ${st(2.6)}/>`;
  if (mouth === 'grin') s += `<path d="M-10,13 Q0,29 10,13Z" fill="#F0618F" ${st(2.4)}/>`;
  if (mouth === 'o') s += `<ellipse cx="0" cy="18" rx="3.6" ry="4.6" fill="#F0618F" ${st(2.2)}/>`;
  if (mouth === 'pout') s += `<path d="M-6,21 Q0,14 6,21" fill="none" ${st(2.6)}/>`;
  if (mouth === 'wail') s += `<path d="M-10,25 Q0,8 10,25 Q0,29 -10,25Z" fill="#F0618F" ${st(2.4)}/>`;

  if (eyes === 'cry') s += drop(-15, 18, 1) + drop(15, 18, 1);
  return s + '</g>';
}

const rocket = (x, y, rot, s = 1) =>
  `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">` +
  `<path d="M-6,13 Q0,34 6,13Z" fill="#FFC14D" ${st(2.2)}><animate attributeName="opacity" values="1;0.4;1" dur="0.5s" repeatCount="indefinite"/></path>` +
  `<path d="M-10,3 L-20,17 L-9,13Z" fill="#FF8FB1" ${st(2.4)}/><path d="M10,3 L20,17 L9,13Z" fill="#FF8FB1" ${st(2.4)}/>` +
  `<path d="M0,-24 Q13,-9 10,13 L-10,13 Q-13,-9 0,-24Z" fill="#fff" ${st(2.6)}/>` +
  `<path d="M0,-24 Q7,-16 9.2,-9 L-9.2,-9 Q-7,-16 0,-24Z" fill="#FF8FB1" ${st(2.4)}/>` +
  `<circle cx="0" cy="1" r="4.8" fill="#7DBDFF" ${st(2.2)}/></g>`;

const planet = (x, y, r = 16) =>
  `<g transform="translate(${x} ${y})"><circle cx="0" cy="0" r="${r}" fill="#FFC79A" ${st(2.6)}/><path d="M${-r * 0.75},${-r * 0.35} Q0,0 ${r * 0.8},${-r * 0.45}" fill="none" stroke="#FFA36B" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="0" cy="1" rx="${n(r * 1.6)}" ry="${n(r * 0.44)}" fill="none" ${st(2.6)} transform="rotate(-16)"/></g>`;

const dino = (x, y, s = 1) =>
  `<g transform="translate(${x} ${y}) scale(${s})">` +
  `<path d="M-32,12 Q-62,14 -78,-4" fill="none" stroke="${INK}" stroke-width="20" stroke-linecap="round"/>` +
  `<path d="M26,-4 Q46,-30 44,-58" fill="none" stroke="${INK}" stroke-width="28" stroke-linecap="round"/>` +
  `<rect x="-26" y="12" width="16" height="24" rx="6" fill="#74D69B" ${st()}/><rect x="14" y="12" width="16" height="24" rx="6" fill="#74D69B" ${st()}/>` +
  `<ellipse cx="0" cy="0" rx="46" ry="27" fill="#8BE3AC" ${st()}/>` +
  `<path d="M-32,12 Q-62,14 -78,-4" fill="none" stroke="#8BE3AC" stroke-width="14.4" stroke-linecap="round"/>` +
  `<path d="M26,-4 Q46,-30 44,-58" fill="none" stroke="#8BE3AC" stroke-width="22.4" stroke-linecap="round"/>` +
  `<ellipse cx="52" cy="-68" rx="23" ry="17" fill="#8BE3AC" ${st()}/>` +
  `<circle cx="58" cy="-73" r="3.6" fill="${INK}"/><path d="M56,-61 Q63,-57 69,-63" fill="none" ${st(2.4)}/><ellipse cx="49" cy="-63" rx="5" ry="3" fill="#FF7FA6" opacity="0.55"/>` +
  `<circle cx="-16" cy="-8" r="5" fill="#5FCB8B"/><circle cx="4" cy="4" r="6" fill="#5FCB8B"/><circle cx="16" cy="-14" r="4" fill="#5FCB8B"/></g>`;

const snail = (x, y, s = 1) =>
  `<g transform="translate(${x} ${y}) scale(${s})">` +
  `<path d="M44,-12 L38,-30 M54,-12 L58,-30" fill="none" ${st(2.6)}/><circle cx="38" cy="-32" r="3.6" fill="${INK}"/><circle cx="58" cy="-32" r="3.6" fill="${INK}"/>` +
  `<path d="M-34,14 Q-44,2 -28,0 L30,0 Q32,-16 48,-16 Q64,-14 62,2 Q60,14 44,14Z" fill="#FFE8A3" ${st()}/>` +
  `<circle cx="52" cy="-4" r="2.6" fill="${INK}"/><path d="M48,4 Q52,8 57,4" fill="none" ${st(2.2)}/>` +
  `<circle cx="0" cy="-16" r="25" fill="#FFC79A" ${st()}/><path d="M0,-16 Q8,-22 8,-12 Q6,-2 -6,-4 Q-16,-8 -14,-22 Q-8,-36 10,-32 Q22,-24 18,-8" fill="none" ${st(2.4)}/></g>`;

const candy = (x, y, s, rot, color) =>
  `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">` +
  `<path d="M-24,0 L-50,-17 Q-43,0 -50,17Z" fill="${color.l}" ${st()}/><path d="M24,0 L50,-17 Q43,0 50,17Z" fill="${color.l}" ${st()}/>` +
  `<ellipse cx="0" cy="0" rx="29" ry="20" fill="${color.c}" ${st()}/>` +
  `<path d="M-12,-17 Q-2,0 -12,17 M6,-19 Q16,0 6,19" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/></g>`;

const lollipop = (x, y, r, color, tilt = 0) =>
  `<g transform="translate(${x} ${y}) rotate(${tilt})">` +
  `<path d="M0,${r} L0,${r + 52}" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="M0,${r} L0,${r + 52}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>` +
  `<circle cx="0" cy="0" r="${r}" fill="${color.c}" ${st()}/>` +
  `<path d="M0,0 Q${n(r * 0.4)},${n(-r * 0.3)} ${n(r * 0.35)},${n(r * 0.2)} Q${n(r * 0.1)},${n(r * 0.65)} ${n(-r * 0.45)},${n(r * 0.35)} Q${n(-r * 0.85)},${n(-r * 0.2)} ${n(-r * 0.3)},${n(-r * 0.7)} Q${n(r * 0.4)},${n(-r * 0.95)} ${n(r * 0.78)},${n(-r * 0.3)}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.85"/></g>`;

const pencil = (x1, y1, x2, y2, color = '#FFD95A') =>
  `<path d="M${x1},${y1} L${x2},${y2}" fill="none" stroke="${INK}" stroke-width="10.5" stroke-linecap="round"/>` +
  `<path d="M${x1},${y1} L${x2},${y2}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round"/>` +
  `<circle cx="${x1}" cy="${y1}" r="2.6" fill="${INK}"/>`;

const DESK = '#F5C49A';
const desk = (x, y, w) =>
  `<rect x="${x + 26}" y="${y + 13}" width="12" height="60" fill="#E7AC7C" ${st()}/><rect x="${x + w - 38}" y="${y + 13}" width="12" height="60" fill="#E7AC7C" ${st()}/>`;
const deskTop = (x, y, w) => `<rect x="${x}" y="${y}" width="${w}" height="16" rx="8" fill="${DESK}" ${st()}/>`;

function headerArt() {
  return svg(256,
    puff([[40, 56, 18], [64, 48, 22], [88, 58, 16]], 0.6) + puff([[150, 222, 16], [172, 214, 20], [196, 224, 15]], 0.6) +
    sparkle(40, 130, 10, '#fff', 0.2) + sparkle(604, 120, 9, '#fff', 0.9) + sparkle(322, 60, 8, '#fff', 0.5) + sparkle(236, 196, 7, '#fff', 1.2) + sparkle(410, 200, 7, '#fff', 0.3) +

    bob(
      blob([[112, 98, 30], [150, 76, 34], [194, 86, 30], [172, 112, 32], [128, 118, 26]], '#fff') + dino(146, 116, 0.52),
      6, 3.2) +
    `<circle cx="244" cy="126" r="7" fill="#fff" ${st(2.4)}/><circle cx="264" cy="140" r="4.6" fill="#fff" ${st(2.4)}/>` +
    bob(
      blob([[452, 88, 30], [494, 72, 34], [534, 90, 30], [508, 114, 30], [468, 116, 26]], '#fff') + rocket(474, 98, -36, 1.05) + planet(524, 94, 14),
      6, 3.2, 0.6) +
    `<circle cx="398" cy="128" r="7" fill="#fff" ${st(2.4)}/><circle cx="378" cy="142" r="4.6" fill="#fff" ${st(2.4)}/>` +

    sway(lollipop(62, 186, 25, C.pink, -10), 62, 262, 4, 3) +
    sway(lollipop(584, 150, 22, C.lav, 10), 584, 224, 4, 3.4) +
    bob(candy(590, 62, 0.62, 18, C.lemon), 5, 2.6, 0.3) +
    bob(candy(246, 44, 0.55, -16, C.mint), 5, 2.8) +
    bob(candy(404, 40, 0.5, 14, C.blue), 5, 2.4, 0.5) +

    limb('M380,244 L408,210', C.lemon.c, 15) +
    pencil(398, 222, 424, 178, '#FF8FB1') +
    hand(410, 206, 10.5) +
    `<path d="M250,262 Q252,210 320,206 Q388,210 390,262Z" fill="${C.lemon.c}" ${st()}/>` +
    bob(head(320, 162, { k: 1.22, eyes: 'big', mouth: 'smile', look: [0, -2] }), 3, 2)
  );
}

function raceArt() {
  const lane = (y) =>
    `<rect x="22" y="${y}" width="596" height="64" rx="32" fill="#fff" opacity="0.8"/>` +
    `<path d="M48,${y + 32} L592,${y + 32}" fill="none" stroke="#F4E3AE" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14"/>`;
  const legs = (x, y) => `<path d="M${x - 8},${y} L${x - 14},${y + 11} M${x + 8},${y} L${x + 15},${y + 10}" fill="none" ${st(3.4)}/>`;
  const speed = (x, y, color) =>
    slide(`<path d="M${x},${y - 10} L${x + 22},${y - 10} M${x - 10},${y + 2} L${x + 18},${y + 2} M${x + 2},${y + 14} L${x + 22},${y + 14}" fill="none" stroke="${color}" stroke-width="4.5" stroke-linecap="round"/>`, 6, 0.7);
  return svg(276,
    `<rect width="640" height="276" fill="${C.lemon.l}"/>` +
    lane(20) + lane(106) + lane(192) +

    pill(286, 52, 196, 40, C.pink.l, '9 岁的大脑', C.pink.d, 23) +
    speed(430, 50, C.pink.c) +
    bob(

let toastTimer;
function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
}

function copyViaEvent(html, text) {
  let handled = false;
  const onCopy = (event) => {
    event.clipboardData.setData('text/html', html);
    event.clipboardData.setData('text/plain', text);
    event.preventDefault();
    handled = true;
  };
  const selection = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(preview);
  selection.removeAllRanges();
  selection.addRange(range);
  document.addEventListener('copy', onCopy);
  let result = false;
  try {
    result = document.execCommand('copy');
  } catch (error) {
    result = false;
  }
  document.removeEventListener('copy', onCopy);
  selection.removeAllRanges();
  return handled && result;
}

async function copyViaClipboardApi(html, text) {
  if (!navigator.clipboard || !window.ClipboardItem) return false;
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([text], { type: 'text/plain' }),
      }),
    ]);
    return true;
  } catch (error) {
    return false;
  }
}

document.getElementById('copy').addEventListener('click', async () => {
  const text = preview.innerText;
  const ok = copyViaEvent(articleHtml, text) || (await copyViaClipboardApi(articleHtml, text));
  toast(ok ? '已复制！去公众号编辑器里 Ctrl / ⌘ + V 粘贴' : '复制失败：请换用电脑上的 Chrome 或 Edge 再试');
});

document.querySelectorAll('.seg button').forEach((button) => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
    preview.classList.toggle('wide', button.dataset.width === 'wide');
  });
});
</script>
</body>
