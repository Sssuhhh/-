<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公众号排版｜名人小时候的5个特征</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F1EEFA;
    color: #3B3355;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 20px;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid #3B3355;
  }
  .bar h1 { margin: 0; font-size: 16px; font-weight: 800; }
  .bar .actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .seg { display: flex; border: 2px solid #3B3355; border-radius: 999px; overflow: hidden; background: #fff; }
  .seg button {
    border: 0; background: transparent; color: #3B3355; cursor: pointer;
    padding: 7px 14px; font-size: 13px; font-weight: 700; font-family: inherit;
  }
  .seg button[aria-pressed="true"] { background: #3B3355; color: #fff; }
  #copy {
    border: 2px solid #3B3355; border-radius: 999px; cursor: pointer;
    background: #FFD23F; color: #3B3355; box-shadow: 3px 3px 0 #3B3355;
    padding: 9px 20px; font-size: 15px; font-weight: 800; font-family: inherit;
    transition: transform .08s, box-shadow .08s;
  }
  #copy:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #3B3355; }
  .steps {
    max-width: 720px; margin: 20px auto 0; padding: 0 16px;
    font-size: 13px; line-height: 1.7; color: #6B6485; text-align: center;
  }
  .steps b { color: #3B3355; }
  .steps a { color: #6A4BE8; font-weight: 700; }
  .stage { padding: 20px 16px 60px; }
  #preview {
    width: 100%; max-width: 420px; margin: 0 auto; background: #fff;
    padding: 22px 16px 30px; border-radius: 26px;
    box-shadow: 0 10px 40px rgba(59, 51, 85, .14);
  }
  #preview.wide { max-width: 709px; }
  #toast {
    position: fixed; left: 50%; bottom: 36px; transform: translate(-50%, 20px);
    background: #3B3355; color: #fff; padding: 11px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 560px) {
    .bar h1 { display: none; }
    .bar { justify-content: center; }
  }
</style>
</head>
<body>

<header class="bar">
  <h1>公众号排版｜名人小时候的5个特征</h1>
  <div class="actions">
    <div class="seg" role="group" aria-label="预览宽度">
      <button type="button" data-width="phone" aria-pressed="true">手机</button>
      <button type="button" data-width="wide" aria-pressed="false">电脑</button>
    </div>
    <button type="button" id="copy">一键复制到公众号</button>
  </div>
</header>

<p class="steps">
  <b>① 点「一键复制到公众号」</b> → <b>② 打开公众号后台的图文编辑器，点一下正文区域</b> → <b>③ Ctrl / ⌘ + V 粘贴</b><br>
  建议用电脑上的 Chrome 或 Edge 操作；文章标题请在后台单独填写。<br>
  封面图下载：<a href="cover-900x383.png" download>横版 2.35:1</a> ｜ <a href="cover-1x1.png" download>方形 1:1</a>
</p>

<main class="stage">
  <div id="preview"></div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- 插画（纯内联 SVG：不含 id / class / style 标签 / 外链，公众号可直接粘贴） ---------- */

const INK = '#3B3355';
const SKIN = '#FFDCC2';
const n = (v) => Math.round(v * 10) / 10;
const st = (w = 3) => `stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
const svg = (h, inner) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 ${h}" style="display:block;width:100%;height:auto;">${inner}</svg>`;

const twinkle = (begin = 0, dur = 1.8) =>
  `<animate attributeName="opacity" values="1;0.2;1" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>`;
const bob = (inner, dy = 6, dur = 3, begin = 0) =>
  `<g>${inner}<animateTransform attributeName="transform" type="translate" values="0 0;0 ${-dy};0 0" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></g>`;
const spin = (inner, cx, cy, dur = 6, dir = 1) =>
  `<g>${inner}<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="${360 * dir} ${cx} ${cy}" dur="${dur}s" repeatCount="indefinite"/></g>`;
const sway = (inner, cx, cy, deg = 8, dur = 2.4) =>
  `<g>${inner}<animateTransform attributeName="transform" type="rotate" values="${-deg} ${cx} ${cy};${deg} ${cx} ${cy};${-deg} ${cx} ${cy}" dur="${dur}s" repeatCount="indefinite"/></g>`;

const sparkle = (x, y, r, fill = '#fff', begin = 0, outline = true) => {
  const k = r * 0.24;
  const d = `M${x},${y - r} Q${x + k},${y - k} ${x + r},${y} Q${x + k},${y + k} ${x},${y + r} Q${x - k},${y + k} ${x - r},${y} Q${x - k},${y - k} ${x},${y - r}Z`;
  return `<path d="${d}" fill="${fill}" ${outline ? st(2.2) : ''}>${twinkle(begin)}</path>`;
};

const star5 = (x, y, R, fill, w = 3) => {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = ((-90 + i * 36) * Math.PI) / 180;
    const r = i % 2 ? R * 0.5 : R;
    pts.push(`${n(x + r * Math.cos(a))},${n(y + r * Math.sin(a))}`);
  }
  return `<polygon points="${pts.join(' ')}" fill="${fill}" ${st(w)}/>`;
};

const limb = (d, color, w = 14) =>
  `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 6}" stroke-linecap="round" stroke-linejoin="round"/>` +
  `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

const hand = (x, y, r = 9) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${SKIN}" ${st()}/>`;

const blob = (circles, fill) =>
  circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${st(6)}/>`).join('') +
  circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join('');

const burst = (cx, cy, rx, ry, fill, points = 14) => {
  const pts = [];
  for (let i = 0; i < points * 2; i++) {
    const a = (i * Math.PI) / points - Math.PI / 2;
    const f = i % 2 ? 0.78 : 1;
    pts.push(`${n(cx + rx * f * Math.cos(a))},${n(cy + ry * f * Math.sin(a))}`);
  }
  return `<polygon points="${pts.join(' ')}" fill="${fill}" ${st()}/>`;
};

const label = (x, y, size, text, fill = INK, extra = '') =>
  `<text x="${x}" y="${y}" font-size="${size}" font-weight="900" fill="${fill}" text-anchor="middle" ${extra}>${text}</text>`;

const gear = (cx, cy, r, fill, teeth = 8) => {
  let t = '';
  for (let i = 0; i < teeth; i++) {
    t += `<rect x="${n(cx - r * 0.22)}" y="${n(cy - r * 1.32)}" width="${n(r * 0.44)}" height="${n(r * 0.6)}" rx="2" fill="${fill}" ${st(2.5)} transform="rotate(${n((i * 360) / teeth)} ${cx} ${cy})"/>`;
  }
  return t + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" ${st(2.5)}/><circle cx="${cx}" cy="${cy}" r="${n(r * 0.36)}" fill="#fff" ${st(2.5)}/>`;
};

const angry = (x, y, s = 1) =>
  `<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="#FF3D5E" stroke-width="5" stroke-linecap="round">` +
  `<path d="M-13,-5 Q-5,-5 -5,-13"/><path d="M13,-5 Q5,-5 5,-13"/><path d="M-13,5 Q-5,5 -5,13"/><path d="M13,5 Q5,5 5,13"/>` +
  `<animate attributeName="opacity" values="1;0.35;1" dur="1.1s" repeatCount="indefinite"/></g>`;

const miniFace = (x, y, s = 1) =>
  `<g transform="translate(${x} ${y}) scale(${s})">` +
  `<circle cx="-9" cy="0" r="3.4" fill="${INK}"/><circle cx="9" cy="0" r="3.4" fill="${INK}"/>` +
  `<path d="M-5,7 Q0,12 5,7" fill="none" ${st(2.6)}/>` +
  `<ellipse cx="-17" cy="7" rx="5" ry="3.2" fill="#FF6F91" opacity="0.55"/><ellipse cx="17" cy="7" rx="5" ry="3.2" fill="#FF6F91" opacity="0.55"/></g>`;

function head(cx, cy, o = {}) {
  const { k = 1, rot = 0, hair = '#5A4036', style = 'bowl', eyes = 'dot', mouth = 'smile', look = [0, 0] } = o;
  const [lx, ly] = look;
  let s = `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${k})">`;

  if (style === 'girl') {
    s += `<circle cx="-43" cy="14" r="14" fill="${hair}" ${st()}/><circle cx="43" cy="14" r="14" fill="${hair}" ${st()}/>`;
  }
  s += `<circle cx="-33" cy="5" r="6" fill="${SKIN}" ${st()}/><circle cx="33" cy="5" r="6" fill="${SKIN}" ${st()}/>`;
  s += `<circle cx="0" cy="0" r="34" fill="${SKIN}" ${st()}/>`;

  const hairPath = {
    bowl: 'M-36,-2 A36,36 0 0 1 36,-2 Q31,-17 16,-18 Q4,-9 -8,-18 Q-24,-17 -36,-2Z',
    spiky: 'M-36,-2 L-42,-17 L-32,-18 L-35,-33 L-21,-30 L-14,-45 L-2,-34 L10,-46 L18,-32 L33,-36 L30,-20 L42,-17 L36,-2 Q22,-18 8,-15 Q-2,-21 -14,-14 Q-26,-17 -36,-2Z',
    girl: 'M-36,-2 A36,36 0 0 1 36,-2 Q30,-17 14,-23 Q-6,-7 -36,-2Z',
  }[style];
  s += `<path d="${hairPath}" fill="${hair}" ${st()}/>`;
  if (style === 'girl') {
    s += `<circle cx="-35" cy="2" r="5" fill="#FF5C7A" ${st(2.2)}/><circle cx="35" cy="2" r="5" fill="#FF5C7A" ${st(2.2)}/>`;
  }

  const ex = 13, ey = 5;
  const dotEye = (x, r) =>
    `<circle cx="${x + lx}" cy="${ey + ly}" r="${r}" fill="${INK}"/><circle cx="${n(x + lx - r * 0.32)}" cy="${n(ey + ly - r * 0.36)}" r="${n(r * 0.36)}" fill="#fff"/>`;
  const arcEye = (x) => `<path d="M${x - 6},${ey + 2} Q${x},${ey - 6} ${x + 6},${ey + 2}" fill="none" ${st(3.2)}/>`;
  if (eyes === 'dot') s += dotEye(-ex, 4.8) + dotEye(ex, 4.8);
  if (eyes === 'big') s += dotEye(-ex, 6.6) + dotEye(ex, 6.6);
  if (eyes === 'happy') s += arcEye(-ex) + arcEye(ex);
  if (eyes === 'wink') s += dotEye(-ex, 4.8) + arcEye(ex);
  if (eyes === 'hmph') {
    s += `<path d="M-20,1 L-8,7" fill="none" ${st(3.4)}/><path d="M20,1 L8,7" fill="none" ${st(3.4)}/>`;
    s += `<path d="M-21,-8 L-9,-3" fill="none" ${st(2.6)}/><path d="M21,-8 L9,-3" fill="none" ${st(2.6)}/>`;
  }

  const puff = eyes === 'hmph' ? 1.35 : 1;
  s += `<ellipse cx="-22" cy="15" rx="${n(6.5 * puff)}" ry="${n(4.2 * puff)}" fill="#FF6F91" opacity="0.6"/><ellipse cx="22" cy="15" rx="${n(6.5 * puff)}" ry="${n(4.2 * puff)}" fill="#FF6F91" opacity="0.6"/>`;

  if (mouth === 'smile') s += `<path d="M-6,15 Q0,21 6,15" fill="none" ${st(2.8)}/>`;
  if (mouth === 'grin') s += `<path d="M-10,13 Q0,29 10,13Z" fill="#E8395B" ${st(2.6)}/>`;
  if (mouth === 'o') s += `<ellipse cx="0" cy="18" rx="3.6" ry="4.6" fill="#E8395B" ${st(2.4)}/>`;
  if (mouth === 'pout') s += `<path d="M-6,21 Q0,14 6,21" fill="none" ${st(2.8)}/>`;
  if (mouth === 'tongue') s += `<ellipse cx="3" cy="20" rx="4.4" ry="5" fill="#FF7C93" ${st(2.2)}/><path d="M-7,14 Q0,21 8,14" fill="none" ${st(2.8)}/>`;

  return s + '</g>';
}

const rocket = (x, y, rot, s = 1) =>
  `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">` +
  `<path d="M-6,13 Q0,34 6,13Z" fill="#FFB020" ${st(2.2)}><animate attributeName="opacity" values="1;0.4;1" dur="0.5s" repeatCount="indefinite"/></path>` +
  `<path d="M-10,3 L-20,17 L-9,13Z" fill="#FF5C7A" ${st(2.4)}/><path d="M10,3 L20,17 L9,13Z" fill="#FF5C7A" ${st(2.4)}/>` +
  `<path d="M0,-24 Q13,-9 10,13 L-10,13 Q-13,-9 0,-24Z" fill="#fff" ${st(2.6)}/>` +
  `<path d="M0,-24 Q7,-16 9.2,-9 L-9.2,-9 Q-7,-16 0,-24Z" fill="#FF5C7A" ${st(2.4)}/>` +
  `<circle cx="0" cy="1" r="4.8" fill="#7CC6FF" ${st(2.2)}/></g>`;

const bulb = (x, y, s = 1) =>
  `<g transform="translate(${x} ${y}) scale(${s})">` +
  `<g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M0,-34 L0,-27"/><path d="M-26,-22 L-21,-17"/><path d="M26,-22 L21,-17"/><path d="M-34,2 L-27,2"/><path d="M34,2 L27,2"/>${twinkle(0, 1.4)}</g>` +
  `<rect x="-8" y="15" width="16" height="13" rx="3" fill="#C9D4E5" ${st(2.6)}/>` +
  `<path d="M-9,18 Q-20,8 -20,-2 A20,20 0 1 1 20,-2 Q20,8 9,18Z" fill="#FFF3A0" ${st()}/>` +
  `<path d="M-6,4 L0,-4 L6,4" fill="none" ${st(2.4)}/></g>`;

function headerArt() {
  return svg(236,
    sparkle(36, 150, 10, '#fff', 0.2) + sparkle(606, 196, 9, '#fff', 0.9) + sparkle(292, 30, 8, '#fff', 0.5) + sparkle(452, 96, 7, '#fff', 1.2) +
    bob(bulb(58, 72), 7, 3.2) +
    bob(rocket(566, 66, 32, 1.35), 8, 2.8, 0.4) +
    spin(gear(596, 148, 13, '#fff'), 596, 148, 7) +
    sway(label(110, 58, 40, '?', '#fff', `stroke="${INK}" stroke-width="3" stroke-linejoin="round"`), 110, 46, 10, 2.2) +
    sway(label(420, 70, 46, '!', '#FFE94A', `stroke="${INK}" stroke-width="3" stroke-linejoin="round"`), 420, 56, 9, 2.6) +

    `<path d="M98,240 Q100,193 150,190 Q200,193 202,240Z" fill="#5BB5FF" ${st()}/>` +
    head(150, 152, { rot: -7, eyes: 'dot', look: [2, -3], mouth: 'o' }) +
    `<circle cx="184" cy="108" r="4" fill="#fff" ${st(2)}/><circle cx="196" cy="92" r="6.5" fill="#fff" ${st(2)}/>` +
    bob(star5(214, 62, 17, '#FFE94A', 2.6), 5, 2.6) +

    `<path d="M440,240 Q442,193 492,190 Q542,193 544,240Z" fill="#8B6CFF" ${st()}/>` +
    head(492, 152, { rot: 7, style: 'girl', hair: '#7A4A2B', eyes: 'wink', mouth: 'tongue' }) +

    limb('M272,206 L242,158', '#2EC4A0', 15) + limb('M368,206 L398,158', '#2EC4A0', 15) +
    hand(240, 154, 10.5) + hand(400, 154, 10.5) +
    `<path d="M258,240 Q258,180 320,176 Q382,180 382,240Z" fill="#2EC4A0" ${st()}/>` +
    bob(head(320, 130, { k: 1.2, style: 'spiky', hair: '#C96A2B', eyes: 'happy', mouth: 'grin' }), 4, 1.6)
  );
}

function scene1() {
  return svg(300,
    `<rect width="640" height="300" fill="#E1F1FF"/>` +
    `<circle cx="44" cy="44" r="6" fill="#fff"/><circle cx="170" cy="140" r="5" fill="#fff"/><circle cx="604" cy="118" r="7" fill="#fff"/><circle cx="430" cy="32" r="5" fill="#fff"/>` +
    sparkle(566, 52, 12, '#FFE94A', 0.3) + sparkle(96, 104, 9, '#fff', 1) +

    blob([[232, 84, 30], [272, 58, 34], [322, 54, 36], [364, 80, 30], [300, 92, 36]], '#fff') +
    `<circle cx="441" cy="110" r="5.5" fill="#fff" ${st(2.6)}/><circle cx="420" cy="100" r="9" fill="#fff" ${st(2.6)}/>` +
    bob(rocket(262, 78, -38, 1.15), 5, 2.4) +
    `<g transform="translate(338 74)"><circle cx="0" cy="0" r="17" fill="#FFB65C" ${st(2.6)}/><path d="M-13,-6 Q0,-1 14,-8" fill="none" stroke="#FF8A3D" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="0" cy="1" rx="27" ry="7.5" fill="none" ${st(2.6)} transform="rotate(-16)"/></g>` +
    sparkle(302, 48, 7, '#FFD23F', 0.6, false) + sparkle(300, 110, 6, '#8B6CFF', 1.1, false) + sparkle(372, 48, 5, '#FF5C7A', 0.2, false) +

    burst(118, 214, 98, 58, '#FFD23F') +
    label(118, 227, 36, '喂——！') +
    `<g fill="none" stroke="#FF5C7A" stroke-width="5.5" stroke-linecap="round"><path d="M232,194 Q246,214 232,234">${twinkle(0, 1.2)}</path><path d="M254,184 Q274,214 254,244">${twinkle(0.3, 1.2)}</path><path d="M276,174 Q302,214 276,254">${twinkle(0.6, 1.2)}</path></g>` +

    `<rect x="386" y="240" width="13" height="70" fill="#B97A4C" ${st()}/><rect x="578" y="240" width="13" height="70" fill="#B97A4C" ${st()}/>` +
    `<path d="M428,236 Q426,191 479,188 Q532,191 530,236Z" fill="#FFD23F" ${st()}/>` +
    head(478, 150, { rot: 8, eyes: 'dot', look: [-3, -4], mouth: 'o' }) +
    `<rect x="356" y="227" width="264" height="17" rx="8.5" fill="#D9925C" ${st()}/>` +
    `<rect x="368" y="207" width="64" height="20" rx="4" fill="#FF8FA8" ${st()}/><rect x="376" y="188" width="50" height="19" rx="4" fill="#7CC6FF" ${st()}/>` +
    label(401, 203, 13, '作业', '#fff') +
    limb('M540,229 L514,188', '#FFD23F') + hand(511, 182) +
    limb('M438,229 L466,227', '#FFD23F') + hand(471, 226, 8.5)
  );
}

function scene2() {
  return svg(300,
    `<rect width="640" height="300" fill="#FFF0D4"/>` +
    `<ellipse cx="330" cy="266" rx="292" ry="24" fill="#FFDFA0"/>` +
    `<circle cx="50" cy="60" r="6" fill="#fff"/><circle cx="596" cy="60" r="7" fill="#fff"/><circle cx="380" cy="42" r="5" fill="#fff"/>` +
    sparkle(160, 88, 11, '#fff', 0.2) + sparkle(516, 96, 10, '#fff', 0.9) + sparkle(346, 112, 7, '#FF5C7A', 0.5, false) +

    `<ellipse cx="92" cy="242" rx="58" ry="17" fill="#B97A4C" ${st()}/>` +
    `<ellipse cx="68" cy="224" rx="15" ry="19" fill="#FFFDF5" ${st()}/>` +
    bob(
      `<circle cx="112" cy="210" r="14.5" fill="#FFE066" ${st()}/><path d="M124,207 L134,211 L124,216Z" fill="#FF9A1F" ${st(2.2)}/><circle cx="117" cy="206" r="2.4" fill="${INK}"/><ellipse cx="111" cy="214" rx="4" ry="2.6" fill="#FF6F91" opacity="0.6"/>`,
      4, 1.4) +
    `<path d="M95,226 L101,218 L106,226 L112,218 L118,226 L123,218 L129,226 Q130,248 112,248 Q94,248 95,226Z" fill="#FFFDF5" ${st()}/>` +
    `<path d="M34,242 Q92,262 150,242 Q146,274 92,274 Q38,274 34,242Z" fill="#D9925C" ${st()}/>` +
    `<path d="M58,258 L74,262 M96,260 L112,264 M124,256 L136,252" fill="none" ${st(2.4)}/>` +

    limb('M248,236 L206,256', '#4C5FD5', 16) + limb('M280,236 L322,256', '#4C5FD5', 16) +
    `<ellipse cx="199" cy="258" rx="13" ry="10" fill="#fff" ${st()}/><ellipse cx="329" cy="258" rx="13" ry="10" fill="#fff" ${st()}/>` +
    `<path d="M236,160 Q230,216 240,238 L288,238 Q298,216 292,160 Q264,151 236,160Z" fill="#2EC4A0" ${st()}/>` +
    bob(head(264, 120, { style: 'spiky', hair: '#C96A2B', eyes: 'big', look: [2, 1], mouth: 'grin' }), 3, 1.2) +
    limb('M240,174 L208,146', '#2EC4A0') +
    sway(
      `<path d="M196,124 L187,107" fill="none" ${st(5.5)}/><path d="M206,142 L196,124" fill="none" stroke="${INK}" stroke-width="16" stroke-linecap="round"/><path d="M206,142 L196,124" fill="none" stroke="#FF5C7A" stroke-width="10" stroke-linecap="round"/>`,
      206, 144, 9, 0.9) +
    hand(207, 144) +
    limb('M288,174 L320,192', '#2EC4A0') + hand(323, 193) +
    spin(gear(338, 180, 11, '#FFD23F'), 338, 180, 4) +

/* ---------- 页面交互 ---------- */

const preview = document.getElementById('preview');
const toastEl = document.getElementById('toast');
const articleHtml = buildArticle();
preview.innerHTML = articleHtml;

let toastTimer;
function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
}

function copyViaEvent(html, text) {
  let handled = false;
  const onCopy = (event) => {
    event.clipboardData.setData('text/html', html);
    event.clipboardData.setData('text/plain', text);
    event.preventDefault();
    handled = true;
  };
  const selection = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(preview);
  selection.removeAllRanges();
  selection.addRange(range);
  document.addEventListener('copy', onCopy);
  let result = false;
  try {
    result = document.execCommand('copy');
  } catch (error) {
    result = false;
  }
  document.removeEventListener('copy', onCopy);
  selection.removeAllRanges();
  return handled && result;
}

async function copyViaClipboardApi(html, text) {
  if (!navigator.clipboard || !window.ClipboardItem) return false;
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([text], { type: 'text/plain' }),
      }),
    ]);
    return true;
  } catch (error) {
    return false;
  }
}

document.getElementById('copy').addEventListener('click', async () => {
  const text = preview.innerText;
  const ok = copyViaEvent(articleHtml, text) || (await copyViaClipboardApi(articleHtml, text));
  toast(ok ? '已复制！去公众号编辑器里 Ctrl / ⌘ + V 粘贴' : '复制失败：请换用电脑上的 Chrome 或 Edge 再试');
});

document.querySelectorAll('.seg button').forEach((button) => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
    preview.classList.toggle('wide', button.dataset.width === 'wide');
  });
});
